<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient (Monochrome Obsidian) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Metallic / Silver Gradient -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a1a1aa"/>
      <stop offset="70%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>

    <!-- Glowing White Linear Gradient -->
    <linearGradient id="white-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#52525b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Inner Core Radial Gradient -->
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#a1a1aa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow Marker White -->
    <marker id="arr-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffffff"/>
    </marker>

    <!-- Arrow Marker Gray -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a1a1aa"/>
    </marker>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
      <circle cx="40" cy="40" r="1" fill="#ffffff" opacity="0.1"/>
    </pattern>

    <!-- Dot Matrix Pattern for Card Accent -->
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top & Bottom Metallic Accent Bars -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#silver-grad)"/>
  <rect x="0" y="625" width="1200" height="5" fill="url(#silver-grad)"/>
  <rect x="0" y="0" width="5" height="630" fill="url(#silver-grad)"/>

  <!-- Decorative HUD Frame & Ticks -->
  <rect x="25" y="25" width="1150" height="580" fill="none" stroke="url(#border-grad)" stroke-width="1" rx="8" opacity="0.5"/>
  
  <!-- Corner Tech Ticks -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1160 20 L 1180 20 L 1180 40" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 20 590 L 20 610 L 40 610" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1160 610 L 1180 610 L 1180 590" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Header Technical Metadata -->
  <text x="45" y="52" font-family="ui-monospace, 'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#a1a1aa" letter-spacing="2" opacity="0.7">
    CORE :: AGENT-LOOP // MONOCHROME EDITION
  </text>
  <line x1="330" y1="48" x2="420" y2="48" stroke="#52525b" stroke-width="1" opacity="0.5"/>

  <!-- Top Right ALPHA Badge -->
  <g transform="translate(985, 42)">
    <rect x="0" y="0" width="145" height="34" rx="6" fill="#18181b" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="2" y="2" width="141" height="30" rx="4" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.5"/>
    <circle cx="18" cy="17" r="4" fill="#ffffff"/>
    <text x="82" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ALPHA v0.6.0
    </text>
  </g>

  <!-- ==================== LEFT MOTIF: AGENT LOOP SYMBOL ==================== -->
  <g transform="translate(240, 315)">
    <!-- Outer Ambient Glow Circle -->
    <circle cx="0" cy="0" r="175" fill="url(#core-grad)"/>

    <!-- Outer Tech Orbit Lines -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.35"/>
    <circle cx="0" cy="0" r="162" fill="none" stroke="#71717a" stroke-width="1" stroke-dasharray="4 12" opacity="0.4"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.25"/>

    <!-- Orbit Directional Arcs -->
    <path d="M -106 -106 A 150 150 0 0 1 106 -106" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="40 120" opacity="0.7"/>
    <path d="M 130 75 A 150 150 0 0 1 -26 148" fill="none" stroke="#d4d4d8" stroke-width="2.5" stroke-dasharray="60 100" opacity="0.7"/>

    <!-- Concentric Target Crosshair Lines -->
    <line x1="-180" y1="0" x2="-120" y2="0" stroke="#a1a1aa" stroke-width="1" opacity="0.4"/>
    <line x1="120" y1="0" x2="180" y2="0" stroke="#a1a1aa" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-180" x2="0" y2="-120" stroke="#a1a1aa" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="120" x2="0" y2="180" stroke="#a1a1aa" stroke-width="1" opacity="0.4"/>

    <!-- Connective Circuit Vectors between Nodes -->
    <!-- Node 1: Perception (0, -125) -->
    <!-- Node 2: Action (108, 62.5) -->
    <!-- Node 3: Feedback (-108, 62.5) -->

    <!-- Perception -> Action Arrow Vector -->
    <path d="M 22 -113 Q 110 -60 100 40" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-white)" opacity="0.9"/>

    <!-- Action -> Feedback Arrow Vector -->
    <path d="M 88 72 Q 0 130 -88 72" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-white)" opacity="0.9"/>

    <!-- Feedback -> Perception Arrow Vector -->
    <path d="M -100 40 Q -110 -60 -22 -113" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-white)" opacity="0.9"/>

    <!-- CENTER CORE NODE (Central Chip / Engine Hub) -->
    <rect x="-32" y="-32" width="64" height="64" rx="8" fill="#18181b" stroke="#ffffff" stroke-width="2"/>
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#09090b" stroke="#a1a1aa" stroke-width="1"/>
    <!-- Core Micro-Grid Icon -->
    <circle cx="0" cy="0" r="10" fill="url(#silver-grad)"/>
    <circle cx="0" cy="0" r="5" fill="#09090b"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>

    <!-- Central Microchip Pins -->
    <line x1="-32" y1="-16" x2="-38" y2="-16" stroke="#ffffff" stroke-width="2"/>
    <line x1="-32" y1="0" x2="-38" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="-32" y1="16" x2="-38" y2="16" stroke="#ffffff" stroke-width="2"/>
    <line x1="32" y1="-16" x2="38" y2="-16" stroke="#ffffff" stroke-width="2"/>
    <line x1="32" y1="0" x2="38" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="32" y1="16" x2="38" y2="16" stroke="#ffffff" stroke-width="2"/>

    <!-- NODE 1: PERCEPTION (Top) -->
    <g transform="translate(0, -125)">
      <circle cx="0" cy="0" r="26" fill="#09090b" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#ffffff"/>
      <!-- Perception Eye Icon -->
      <ellipse cx="0" cy="0" rx="9" ry="5" fill="#09090b"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <!-- Node Label -->
      <rect x="-42" y="-45" width="84" height="18" rx="4" fill="#18181b" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="-33" font-family="ui-monospace, 'SF Mono', monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        PERCEPTION
      </text>
    </g>

    <!-- NODE 2: ACTION (Bottom Right) -->
    <g transform="translate(108, 62.5)">
      <circle cx="0" cy="0" r="26" fill="#09090b" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#e4e4e7"/>
      <!-- Action Cursor Bolt Icon -->
      <path d="M -3 -7 L 4 -7 L -1 1 L 4 1 L -4 8 L -1 2 L -5 2 Z" fill="#09090b"/>
      <!-- Node Label -->
      <rect x="-32" y="32" width="64" height="18" rx="4" fill="#18181b" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="44" font-family="ui-monospace, 'SF Mono', monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        ACTION
      </text>
    </g>

    <!-- NODE 3: FEEDBACK (Bottom Left) -->
    <g transform="translate(-108, 62.5)">
      <circle cx="0" cy="0" r="26" fill="#09090b" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#a1a1aa"/>
      <!-- Feedback Refresh Icon -->
      <path d="M -4 -3 A 6 6 0 1 1 5 1 M 5 -3 L 5 2 L 0 2" fill="none" stroke="#09090b" stroke-width="2" stroke-linecap="round"/>
      <!-- Node Label -->
      <rect x="-38" y="32" width="76" height="18" rx="4" fill="#18181b" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="44" font-family="ui-monospace, 'SF Mono', monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        FEEDBACK
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: WORDMARK & TYPOGRAPHY ==================== -->
  <g transform="translate(480, 0)">
    <!-- Decorative Vertical Separation Line -->
    <line x1="-15" y1="120" x2="-15" y2="510" stroke="url(#border-grad)" stroke-width="1" opacity="0.4"/>
    <circle cx="-15" cy="120" r="2.5" fill="#ffffff"/>
    <circle cx="-15" cy="510" r="2.5" fill="#ffffff"/>

    <!-- Main Project Title Wordmark -->
    <text x="15" y="275" font-family="ui-monospace, 'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-2">
      open-compute
    </text>

    <!-- Subtitle Underline Accent -->
    <rect x="18" y="295" width="620" height="3" fill="url(#silver-grad)"/>

    <!-- Primary Tagline -->
    <text x="18" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#d4d4d8" letter-spacing="0.2">
      model-agnostic computer-use core
    </text>

    <!-- Model Integration Line -->
    <g transform="translate(18, 368)">
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#a1a1aa" letter-spacing="0.5">
        Backends:
      </text>
      <!-- Backend Badges -->
      <g transform="translate(82, -14)">
        <!-- Claude -->
        <rect x="0" y="0" width="85" height="22" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1"/>
        <text x="42.5" y="15" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
          Claude
        </text>

        <!-- OpenAI -->
        <rect x="95" y="0" width="85" height="22" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1"/>
        <text x="137.5" y="15" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
          OpenAI
        </text>

        <!-- Mock / Offline -->
        <rect x="190" y="0" width="115" height="22" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1"/>
        <text x="247.5" y="15" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
          Mock (Offline)
        </text>
      </g>
    </g>

    <!-- Feature Pills Container -->
    <g transform="translate(18, 432)">
      <!-- Pill 1: Perception-Action Loop -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="34" rx="6" fill="#18181b" stroke="#ffffff" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#ffffff"/>
        <text x="98" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
          Perception → Action
        </text>
      </g>

      <!-- Pill 2: Zero Dependencies -->
      <g transform="translate(192, 0)">
        <rect x="0" y="0" width="170" height="34" rx="6" fill="#18181b" stroke="#a1a1aa" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#a1a1aa"/>
        <text x="93" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e4e4e7" text-anchor="middle" letter-spacing="0.5">
          Zero-Dep Core
        </text>
      </g>

      <!-- Pill 3: Keyless Mode A -->
      <g transform="translate(374, 0)">
        <rect x="0" y="0" width="155" height="34" rx="6" fill="#18181b" stroke="#71717a" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#71717a"/>
        <text x="85" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d4d4d8" text-anchor="middle" letter-spacing="0.5">
          Keyless Mode A
        </text>
      </g>
    </g>
  </g>

  <!-- Footer Technical Coordinates / Status Bar -->
  <g transform="translate(45, 582)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="11" fill="#71717a" letter-spacing="1">
      DIM: 1200x630px | RATIO: 1.91:1 | FORMAT: SVG VECTOR | ECOSYSTEM: ELLMOS / OPEN-BRICKS
    </text>
  </g>

  <g transform="translate(1155, 582)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ffffff" text-anchor="end" letter-spacing="1">
      MONOCHROME v1.0
    </text>
  </g>
</svg>
