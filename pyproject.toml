[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-compute"
version = "0.9.1"
description = "Model-agnostic computer-use core: one agent loop for Claude, OpenAI CUA, and a mock backend, with normalized coordinates, a canonical action schema, and a central safety gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
authors = [
    {name = "The open-compute authors"},
]
keywords = [
    "computer-use", "agent", "automation", "claude", "openai", "cua",
    "gui-automation", "browser-automation", "set-of-marks", "ai-agent",
    "local-first", "zero-egress", "accessibility", "mcp", "mcp-server",
    "desktop-automation", "windows", "safety", "ellmos-ai", "open-bricks",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40.0"]
openai = ["openai>=1.40.0"]
browser = ["playwright>=1.40.0"]
local = ["mss>=9.0"]
compose = ["Pillow>=10.0"]
uia = ["uiautomation>=2.0.18"]
wgc = ["windows-capture>=2.0.0; platform_system == 'Windows'", "Pillow>=10.0"]
watch = ["watchdog>=3.0"]
# clirec ist ein eigenes Modul: gepinnte Git-Quelle statt blossem Paketnamen
# (Plan D 10.7). SHA statt Tag, weil das Repo keine Tags hat; 579c8c1 = 0.3.0.
clirec = ["clirec @ git+https://github.com/ellmos-ai/clirec@579c8c199825c92bd01c0afaa6dc68c7804c2721"]
dev = ["pytest>=7.0"]
record = ["clirec[record] @ git+https://github.com/ellmos-ai/clirec@579c8c199825c92bd01c0afaa6dc68c7804c2721"]
mcp = ["mcp>=1.12,<2"]
all = ["anthropic>=0.40.0", "openai>=1.40.0", "playwright>=1.40.0", "mss>=9.0", "Pillow>=10.0", "uiautomation>=2.0.18", "windows-capture>=2.0.0; platform_system == 'Windows'", "watchdog>=3.0", "clirec[record] @ git+https://github.com/ellmos-ai/clirec@579c8c199825c92bd01c0afaa6dc68c7804c2721", "mcp>=1.12,<2"]

[project.scripts]
oc = "open_compute.cli:main"
open-compute-mcp = "open_compute.mcp_bootstrap:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/open-compute"
Documentation = "https://github.com/ellmos-ai/open-compute#readme"
Repository = "https://github.com/ellmos-ai/open-compute"
Issues = "https://github.com/ellmos-ai/open-compute/issues"
Notice = "https://github.com/ellmos-ai/open-compute/blob/master/NOTICE"
Changelog = "https://github.com/ellmos-ai/open-compute/blob/master/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/open-compute/blob/master/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/open-compute/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/open-compute/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/open-compute/blob/master/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["open_compute*"]

[tool.setuptools.package-data]
# Bundled perception-mode profiles, loaded by name at runtime.
open_compute = ["profiles/*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = "."
addopts = "-ra -v"
norecursedirs = [".git", ".pytest_cache", "__pycache__", "build", "dist", ".venv"]
